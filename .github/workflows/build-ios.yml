name: build-ios

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  orgmark-ios:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Show selected Xcode
        shell: bash
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Export Xcode base directory
        shell: bash
        run: |
          developer_dir="$(xcode-select -p)"
          xcode_base_dir="$(dirname "$(dirname "$developer_dir")")"
          echo "XCODE_BASE_DIR=$xcode_base_dir" >> "$GITHUB_ENV"

      - name: Prepare writable nixbld Xcode directories
        shell: bash
        run: |
          sudo mkdir -p \
            /var/empty/Library/Caches/org.swift.swiftpm/manifests \
            /var/empty/Library/Caches/com.apple.dt.Xcode/Downloads \
            /var/empty/Library/Caches/com.apple.dt.xcodebuild \
            /var/empty/Library/Developer/Xcode/DerivedData \
            /var/empty/Library/Developer/CoreSimulator/Devices

          sudo chmod -R 0777 /var/empty/Library

      - name: Verify nixbld write access paths
        shell: bash
        run: |
          ls -ld /var/empty /var/empty/Library
          ls -ld /var/empty/Library/Caches \
            /var/empty/Library/Caches/org.swift.swiftpm \
            /var/empty/Library/Caches/org.swift.swiftpm/manifests \
            /var/empty/Library/Caches/com.apple.dt.Xcode/Downloads \
            /var/empty/Library/Caches/com.apple.dt.xcodebuild \
            /var/empty/Library/Developer/Xcode/DerivedData \
            /var/empty/Library/Developer/CoreSimulator/Devices

      - name: Build OrgMark iOS simulator app
        shell: bash
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            build .#orgmark-ios \
            --impure \
            --option sandbox relaxed \
            --print-build-logs

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orgmark-ios-simulator
          path: result
          if-no-files-found: error
