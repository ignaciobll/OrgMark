name: build-ios

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  orgmark-ios:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Show selected Xcode
        shell: bash
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Export Xcode base directory
        shell: bash
        run: |
          developer_dir="$(xcode-select -p)"
          xcode_base_dir="$(dirname "$(dirname "$developer_dir")")"
          echo "XCODE_BASE_DIR=$xcode_base_dir" >> "$GITHUB_ENV"

      - name: Build OrgMark iOS simulator app via nix run
        shell: bash
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            run .#build-orgmark-ios \
            --impure \
            --print-build-logs

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orgmark-ios-simulator
          path: build/ios-simulator
          if-no-files-found: error
